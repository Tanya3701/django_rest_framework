version: '3.9'

services:
    web:
        build: .
        command:
            bash -c "python manage.py migrate &&
                    python manage.py runserver 0.0.0.0:8000"
        ports:
            - "8000:8000"
        env_file:
            - .env
        volumes:
            - .:/app
            - static_volume:/code/static
        depends_on:
            - db
            - redis
        networks:
            - app_network
    db:
        image: postgres:17
        container_name: db
        env_file:
            - .env.
        volumes:
            - postgres_data:/var/lib/postgresql/data
        networks:
            - app_network
    redis:
        image: redis:7
        container_name: redis
        ports:
            - "6379:6379"
        env_file:
            - .env
        volumes:
            - redis_data:/data
    celery:
        build: .
        command:
            bash -c "celery -A config worker --loglevel=info --pool=solo"
        env_file:
            - .env
        volumes:
            - .:/app
        depends_on:
            - db
            - redis

    celery_beat:
        build: .
        command:
            bash -c "celery -A config beat -l info"
        env_file:
            - .env
        volumes:
            - .:/app
        depends_on:
            - db
            - redis
            - celery
networks:
    app_network:
        driver: bridge
volumes:
    postgres_data:
    redis_data:
    static_volume:
